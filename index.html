<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід до системи</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 40px 16px;
    color: #1f2933;
  }
  h2 {
    text-align: center;
    margin-bottom: 24px;
  }
  form {
    max-width: 340px;
    margin: 0 auto;
    padding: 24px;
    background: #ffffff;
    border: 1px solid #c8d1dc;
    border-radius: 8px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
  }
  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 10px;
    margin-bottom: 16px;
    border: 1px solid #9aa5b1;
    border-radius: 4px;
    font-size: 15px;
  }
  input.valid {
    border-color: #2e9e57;
    background: #f3fbf5;
  }
  input.invalid {
    border-color: #d33a3a;
    background: #fff6f6;
  }
  input:focus {
    outline: 2px solid #2f6fdb;
    outline-offset: 1px;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    font-weight: normal;
    cursor: pointer;
  }
  button[type="submit"] {
    width: 100%;
    padding: 10px;
    background: #2f6fdb;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  button[type="submit"]:hover {
    background: #2459b3;
  }
  #message {
    max-width: 340px;
    margin: 16px auto 0;
    padding: 0;
    text-align: center;
    border-radius: 4px;
  }
  #message.success {
    padding: 10px;
    background: #e3f6e8;
    color: #1b6b34;
    border: 1px solid #8fd1a4;
  }
  #message.error {
    padding: 10px;
    background: #fde8e8;
    color: #a12525;
    border: 1px solid #f0a3a3;
  }
</style>
</head>
<body>
<h2>Вхід до інформаційної системи</h2>

<form id="loginForm" novalidate>
  <label for="email">Електронна пошта</label>
  <input type="email" id="email" name="email" placeholder="name@example.com" required>

  <label for="password">Пароль</label>
  <input type="password" id="password" name="password" minlength="8" required>

  <label class="toggle">
    <input type="checkbox" id="showPassword"> Показати пароль
  </label>

  <button type="submit">Увійти</button>
</form>

<p id="message" role="status"></p>

<script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const message = document.getElementById('message');
  const showPassword = document.getElementById('showPassword');

  // Додаткове завдання: показати/приховати пароль
  showPassword.addEventListener('change', function () {
    passwordInput.type = showPassword.checked ? 'text' : 'password';
  });

  function show(type, text) {
    message.textContent = text;
    message.className = type; // 'success' (зелене) або 'error' (червоне)
  }

  function mark(input, ok) {
    input.classList.toggle('valid', ok);
    input.classList.toggle('invalid', !ok);
  }

  // Повертає текст помилки або '' якщо поле коректне
  function emailError() {
    if (emailInput.value.trim() === '') {
      return 'Помилка: введіть електронну пошту.';
    }
    if (!emailInput.validity.valid) { // перевірка формату type="email"
      return 'Помилка: некоректний формат електронної пошти.';
    }
    return '';
  }

  function passwordError() {
    if (passwordInput.value === '') {
      return 'Помилка: введіть пароль.';
    }
    if (passwordInput.value.length < 8) {
      return 'Помилка: пароль має містити не менше 8 символів.';
    }
    return '';
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    const eErr = emailError();
    const pErr = passwordError();

    mark(emailInput, eErr === '');
    mark(passwordInput, pErr === '');

    if (eErr) {
      show('error', eErr);
    } else if (pErr) {
      show('error', pErr);
    } else {
      show('success', 'Успішно: пошта та пароль коректні.');
    }
  });
</script>
</body>
</html>
